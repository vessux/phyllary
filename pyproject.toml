[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phyllary"
version = "0.1.0"
description = "A workflow-verb facade over existing project primitives"
requires-python = ">=3.11"

[project.scripts]
phyllary = "phyllary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
