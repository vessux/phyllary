name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: |
          go install github.com/steveyegge/beads/cmd/bd@ce242a879
          sudo install -m 0755 "$(go env GOPATH)/bin/bd" /usr/local/bin/bd
      - run: python -m pip install .
      - run: bats tests/bats
      - run: python -m unittest discover -s tests/python
      - run: shellcheck -S error bin/phyllary
