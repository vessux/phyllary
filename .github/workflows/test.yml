name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - run: python -m pip install .
      - run: bats tests/bats
      - run: python -m unittest discover -s tests/python
      - run: shellcheck -S error bin/phyllary
